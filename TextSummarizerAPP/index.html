<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summarizer — condense long text with T5</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper:      #EDEBE3;
    --surface:    #FFFFFF;
    --wash:       #FBF0E4;
    --ink:        #2E2A22;
    --muted:      #6E6A5F;
    --edge:       #DAD6C9;
    --accent:     #C1520E;
    --accent-dim: #A6450B;
    --accent-pale:#F5D9BE;
    --danger:     #9B2C2C;
    --danger-bg:  #FAE9E4;

    --sans: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;

    --r: 6px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    max-width: 1120px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }

  /* ---------- masthead ---------- */

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--edge);
  }

  .wordmark {
    font-family: var(--serif);
    font-size: 25px;
    font-weight: 600;
    letter-spacing: -0.015em;
    margin: 0;
  }

  .wordmark span {
    color: var(--accent);
  }

  .masthead p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }

  /* ---------- lede ---------- */

  .lede {
    margin: 40px 0 28px;
    max-width: 34ch;
  }

  .lede h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(30px, 5vw, 44px);
    line-height: 1.12;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }

  .lede p {
    margin: 0;
    color: var(--muted);
    max-width: 46ch;
    font-size: 15px;
  }

  /* ---------- workspace ---------- */

  .workspace {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    align-items: start;
  }

  @media (min-width: 900px) {
    .workspace {
      grid-template-columns: 1fr 76px 1fr;
      gap: 0;
    }
  }

  .panel {
    border: 1px solid var(--edge);
    border-radius: var(--r);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .panel--result {
    background: var(--wash);
    border-color: var(--accent-pale);
  }

  .panel-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 16px;
    border-bottom: 1px solid var(--edge);
    min-height: 44px;
  }

  .panel--result .panel-bar { border-bottom-color: var(--accent-pale); }

  .panel-bar h3 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .meta {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  textarea {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.62;
    color: var(--ink);
    border: 0;
    background: transparent;
    resize: vertical;
    padding: 18px 16px;
    min-height: 300px;
    width: 100%;
    outline: none;
  }

  textarea::placeholder { color: #A9A398; }

  .panel-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-top: 1px solid var(--edge);
    flex-wrap: wrap;
  }

  /* ---------- gutter ---------- */

  .gutter {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 56px;
  }

  @media (min-width: 900px) {
    .gutter::before {
      content: "";
      position: absolute;
      top: 24px;
      bottom: 24px;
      width: 1px;
      background: var(--edge);
    }
  }

  .ratio {
    position: relative;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: var(--paper);
    border: 1px solid var(--accent);
    color: var(--accent-dim);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    opacity: 0;
    transform: scale(0.9);
    transition: opacity .28s ease, transform .28s ease;
  }

  .ratio.is-shown { opacity: 1; transform: scale(1); }

  .ratio b {
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .ratio i {
    font-style: normal;
    font-size: 10px;
    color: var(--muted);
  }

  /* ---------- result body ---------- */

  .result-body {
    padding: 18px 16px;
    min-height: 300px;
    flex: 1;
  }

  .summary {
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1.65;
    margin: 0;
    white-space: pre-wrap;
  }

  .placeholder {
    font-family: var(--sans);
    font-size: 14px;
    color: var(--muted);
    margin: 0;
    max-width: 34ch;
  }

  .alert {
    background: var(--danger-bg);
    border: 1px solid #EFC9BE;
    border-radius: var(--r);
    padding: 12px 14px;
    color: var(--danger);
    font-size: 14px;
    margin: 0;
  }

  .alert strong { display: block; margin-bottom: 2px; }

  /* skeleton while the model runs */
  .skeleton { display: grid; gap: 12px; }

  .skeleton i {
    display: block;
    height: 13px;
    border-radius: 3px;
    background: linear-gradient(90deg, #F0DFCB 0%, #F8ECDD 50%, #F0DFCB 100%);
    background-size: 220% 100%;
    animation: sweep 1.5s linear infinite;
  }

  .skeleton i:nth-child(2) { width: 92%; animation-delay: .1s; }
  .skeleton i:nth-child(3) { width: 78%; animation-delay: .2s; }
  .skeleton i:nth-child(4) { width: 40%; animation-delay: .3s; }

  @keyframes sweep {
    from { background-position: 120% 0; }
    to   { background-position: -120% 0; }
  }

  /* ---------- controls ---------- */

  button {
    font-family: var(--sans);
    font-size: 14px;
    cursor: pointer;
  }

  .btn {
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--accent);
    border-radius: var(--r);
    padding: 9px 20px;
    font-weight: 600;
    transition: background .15s ease;
  }

  .btn:hover:not(:disabled) { background: var(--accent-dim); border-color: var(--accent-dim); }

  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .btn-quiet {
    background: none;
    border: 0;
    padding: 4px 2px;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--edge);
  }

  .btn-quiet:hover:not(:disabled) { color: var(--ink); text-decoration-color: var(--muted); }

  .btn-quiet:disabled { opacity: .45; cursor: not-allowed; }

  .quiet-group { display: flex; gap: 16px; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  .panel:focus-within { border-color: #BFB9A9; }

  .hint {
    font-size: 12px;
    color: var(--muted);
  }

  kbd {
    font-family: var(--sans);
    font-size: 11px;
    border: 1px solid var(--edge);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    background: #fff;
  }

  footer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--edge);
    font-size: 12px;
    color: var(--muted);
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .ratio { transform: none; }
  }
</style>
</head>

<body>
<div class="shell">

  <header class="masthead">
    <h1 class="wordmark">Summarizer<span>.</span></h1>
  </header>

  <div class="lede">
    <h2>Long conversations, down to a few lines.</h2>
    <p>Paste a chat log, a transcript, or an article. The model reads it and writes back the short version.</p>
  </div>

  <div class="workspace">

    <!-- source -->
    <section class="panel">
      <div class="panel-bar">
        <h3><label for="dialogue-input">Source text</label></h3>
        <span class="meta" id="input-count">0 words</span>
      </div>

      <textarea id="dialogue-input"
                placeholder="Amanda: I baked cookies, want some?&#10;Jerry: Sure! Where do you live?&#10;Amanda: At home, come over…"
                spellcheck="false"></textarea>

      <div class="panel-foot">
        <div class="quiet-group">
          <button type="button" class="btn-quiet" id="example-btn">Load an example</button>
          <button type="button" class="btn-quiet" id="clear-btn" disabled>Clear</button>
        </div>
        <span class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to run</span>
      </div>
    </section>

    <!-- compression ratio -->
    <div class="gutter">
      <div class="ratio" id="ratio" aria-hidden="true">
        <b id="ratio-value">—</b>
        <i>shorter</i>
      </div>
    </div>

    <!-- result -->
    <section class="panel panel--result">
      <div class="panel-bar">
        <h3>Summary</h3>
        <span class="meta" id="output-meta"></span>
      </div>

      <div class="result-body" id="result-body">
        <p class="placeholder">Nothing summarized yet. Add some text on the left and press Summarize.</p>
      </div>

      <div class="panel-foot">
        <button type="button" class="btn" id="run-btn" disabled>Summarize</button>
        <button type="button" class="btn-quiet" id="copy-btn" hidden>Copy summary</button>
      </div>
    </section>

  </div>

  <p class="sr-only" role="status" aria-live="polite" id="live-region"></p>

  <footer>Shreya Agarwal</footer>
</div>

<script>
(function () {
  "use strict";

  const input      = document.getElementById("dialogue-input");
  const inputCount = document.getElementById("input-count");
  const runBtn     = document.getElementById("run-btn");
  const clearBtn   = document.getElementById("clear-btn");
  const exampleBtn = document.getElementById("example-btn");
  const copyBtn    = document.getElementById("copy-btn");
  const resultBody = document.getElementById("result-body");
  const outputMeta = document.getElementById("output-meta");
  const ratio      = document.getElementById("ratio");
  const ratioValue = document.getElementById("ratio-value");
  const live       = document.getElementById("live-region");

  const TIMEOUT_MS = 180000;

  const SAMPLE = [
    "Priya: are we still on for the 3pm sync or has it moved again",
    "Daniel: moved. Meera pushed it to 4:30 because the client call ran long",
    "Priya: ok. do I need the revenue slides ready by then",
    "Daniel: yes, at least the Q3 breakdown. she said the rest can wait until Friday",
    "Priya: fine. I'll send you the deck an hour before so you can check the numbers",
    "Daniel: perfect. also she wants one slide on churn, nothing fancy, just the trend",
    "Priya: adding it now. see you at 4:30"
  ].join("\n");

  let busy = false;

  const countWords = (t) => t.trim() ? t.trim().split(/\s+/).length : 0;

  function syncInputState() {
    const words = countWords(input.value);
    inputCount.textContent = words === 1 ? "1 word" : words + " words";
    runBtn.disabled = busy || words === 0;
    clearBtn.disabled = busy || input.value.length === 0;
  }

  function showPlaceholder(text) {
    resultBody.innerHTML = "";
    const p = document.createElement("p");
    p.className = "placeholder";
    p.textContent = text;
    resultBody.appendChild(p);
  }

  function showError(title, detail) {
    resultBody.innerHTML = "";
    const box = document.createElement("p");
    box.className = "alert";
    const strong = document.createElement("strong");
    strong.textContent = title;
    box.appendChild(strong);
    box.appendChild(document.createTextNode(detail));
    resultBody.appendChild(box);
    live.textContent = title + " " + detail;
  }

  function showSkeleton() {
    resultBody.innerHTML =
      '<div class="skeleton"><i></i><i></i><i></i><i></i></div>';
  }

  function resetOutputChrome() {
    outputMeta.textContent = "";
    copyBtn.hidden = true;
    copyBtn.textContent = "Copy summary";
    ratio.classList.remove("is-shown");
  }

  async function run() {
    const dialogue = input.value.trim();
    if (!dialogue || busy) return;

    busy = true;
    runBtn.textContent = "Summarizing…";
    syncInputState();
    resetOutputChrome();
    showSkeleton();
    live.textContent = "Summarizing.";

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
    const started = performance.now();

    try {
      const response = await fetch("/summarize/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ dialogue: dialogue }),
        signal: controller.signal
      });

      if (!response.ok) {
        let detail = "The server returned status " + response.status + ".";
        try {
          const body = await response.json();
          if (body && body.detail) detail = String(body.detail);
        } catch (_) { /* body was not JSON */ }
        showError("Summarizing failed. ", detail);
        return;
      }

      const data = await response.json();
      const summary = (data && data.summary || "").trim();

      if (!summary) {
        showPlaceholder("The model returned an empty summary. Try adding more context to the source text.");
        return;
      }

      resultBody.innerHTML = "";
      const p = document.createElement("p");
      p.className = "summary";
      p.textContent = summary;
      resultBody.appendChild(p);

      const inWords  = countWords(dialogue);
      const outWords = countWords(summary);
      const seconds  = ((performance.now() - started) / 1000).toFixed(1);
      const pct = inWords ? Math.max(0, Math.round((1 - outWords / inWords) * 100)) : 0;

      outputMeta.textContent = outWords + " words · " + seconds + "s";
      ratioValue.textContent = pct + "%";
      ratio.classList.add("is-shown");
      copyBtn.hidden = false;
      live.textContent = "Summary ready, " + outWords + " words.";

    } catch (err) {
      if (err.name === "AbortError") {
        showError("Timed out. ", "The model did not respond within three minutes. It may still be loading — try again in a moment.");
      } else {
        showError("Could not reach the server. ", "Check that the app is running, then try again.");
      }
    } finally {
      clearTimeout(timer);
      busy = false;
      runBtn.textContent = "Summarize";
      syncInputState();
    }
  }

  input.addEventListener("input", syncInputState);

  input.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      run();
    }
  });

  runBtn.addEventListener("click", run);

  clearBtn.addEventListener("click", () => {
    input.value = "";
    resetOutputChrome();
    showPlaceholder("Nothing summarized yet. Add some text on the left and press Summarize.");
    syncInputState();
    input.focus();
  });

  exampleBtn.addEventListener("click", () => {
    input.value = SAMPLE;
    resetOutputChrome();
    showPlaceholder("Example loaded. Press Summarize to run it through the model.");
    syncInputState();
    input.focus();
  });

  copyBtn.addEventListener("click", async () => {
    const text = resultBody.textContent.trim();
    try {
      await navigator.clipboard.writeText(text);
      copyBtn.textContent = "Copied";
      setTimeout(() => { copyBtn.textContent = "Copy summary"; }, 1800);
    } catch (_) {
      copyBtn.textContent = "Press Ctrl+C to copy";
      const range = document.createRange();
      range.selectNodeContents(resultBody);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  });

  syncInputState();
})();
</script>
</body>
</html>
